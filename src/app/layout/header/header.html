<header class="fixed w-full top-0 z-[200] glass-tach transition-all duration-300 px-4 md:px-8 py-3 warm-shadow border-b border-[#C89965]/20">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <!-- Brand Logo & Name -->
    <a routerLink="/" class="flex items-center gap-3 cursor-pointer shrink-0 group">
      <div class="relative w-11 h-11 rounded-full overflow-hidden border-2 border-[#C89965] shadow-sm transition-transform duration-300 group-hover:scale-105">
        <img src="/logo.jpg" alt="Tách Tách Photobooth" class="w-full h-full object-cover" />
      </div>
      <div class="flex flex-col">
        <span class="text-xl md:text-2xl font-serif font-bold text-[#681423] tracking-tight leading-none">
          Tách Tách
        </span>
        <span class="text-[10px] md:text-xs font-sans font-semibold tracking-[0.2em] text-[#C89965] uppercase mt-0.5">
          Photobooth
        </span>
      </div>
    </a>

    <!-- Nav Desktop -->
    <nav class="hidden md:flex items-center gap-1 lg:gap-2 bg-white/80 px-4 py-1.5 rounded-full border border-[#C89965]/25 shadow-sm">
      <a routerLink="/" routerLinkActive="bg-[#681423] text-white!" [routerLinkActiveOptions]="{exact: true}" 
         class="text-xs lg:text-sm font-sans font-medium px-4 py-1.5 rounded-full text-[#2C1A1D] hover:text-[#681423] hover:bg-[#FAF6F0] transition-all">
        Trang Chủ
      </a>
      <a routerLink="/phong-chup" routerLinkActive="bg-[#681423] text-white!" 
         class="text-xs lg:text-sm font-sans font-medium px-4 py-1.5 rounded-full text-[#2C1A1D] hover:text-[#681423] hover:bg-[#FAF6F0] transition-all">
        Phòng Chụp Studio
      </a>
      <a routerLink="/dat-lich" routerLinkActive="bg-[#681423] text-white!" 
         class="text-xs lg:text-sm font-sans font-medium px-4 py-1.5 rounded-full text-[#2C1A1D] hover:text-[#681423] hover:bg-[#FAF6F0] transition-all">
        Đặt Lịch Chụp
      </a>
      <a routerLink="/in-anh" routerLinkActive="bg-[#681423] text-white!" 
         class="text-xs lg:text-sm font-sans font-medium px-4 py-1.5 rounded-full text-[#2C1A1D] hover:text-[#681423] hover:bg-[#FAF6F0] transition-all flex items-center gap-1.5">
        <span>Gửi Ảnh In</span>
        <span class="inline-block w-2 h-2 rounded-full bg-[#C89965] animate-pulse"></span>
      </a>
    </nav>

    <!-- Right Action Button (Desktop) -->
    <div class="hidden md:flex items-center gap-3">
      <a routerLink="/in-anh" class="text-xs font-medium text-[#681423] border border-[#681423]/30 px-3.5 py-1.5 rounded-full hover:bg-[#681423]/5 transition-all">
        Đẩy Ảnh In
      </a>
      <a routerLink="/dat-lich" class="text-xs font-semibold text-white bg-[#681423] hover:bg-[#7E1B2E] px-4 py-2 rounded-full shadow-sm hover:shadow transition-all">
        Đặt Phòng Chụp
      </a>
    </div>

    <!-- Nút Menu Hamburger (Mobile) -->
    <button class="md:hidden flex items-center justify-center p-2 text-[#681423] focus:outline-none" (click)="toggleMobileMenu()" aria-label="Menu">
      <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div *ngIf="isMobileMenuOpen()" class="md:hidden absolute top-full left-0 w-full bg-[#FAF6F0]/98 backdrop-blur-md border-b border-[#C89965]/25 warm-shadow flex flex-col py-4 px-6 gap-3">
    <a routerLink="/" routerLinkActive="text-[#681423] font-bold" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()" 
       class="text-base font-sans font-medium text-[#2C1A1D] py-2 border-b border-[#E8DDD2]/60">
      Trang Chủ
    </a>
    <a routerLink="/phong-chup" routerLinkActive="text-[#681423] font-bold" (click)="closeMobileMenu()" 
       class="text-base font-sans font-medium text-[#2C1A1D] py-2 border-b border-[#E8DDD2]/60">
      Phòng Chụp Studio
    </a>
    <a routerLink="/dat-lich" routerLinkActive="text-[#681423] font-bold" (click)="closeMobileMenu()" 
       class="text-base font-sans font-medium text-[#2C1A1D] py-2 border-b border-[#E8DDD2]/60">
      Đặt Lịch Chụp
    </a>
    <a routerLink="/in-anh" routerLinkActive="text-[#681423] font-bold" (click)="closeMobileMenu()" 
       class="text-base font-sans font-medium text-[#2C1A1D] py-2 border-b border-[#E8DDD2]/60 flex items-center justify-between">
      <span>Gửi Ảnh In Lấy Liền</span>
      <span class="text-xs bg-[#C89965] text-white px-2 py-0.5 rounded-full font-bold">Hot</span>
    </a>
    <div class="pt-2 flex flex-col gap-2">
      <a routerLink="/dat-lich" (click)="closeMobileMenu()" class="text-center w-full py-2.5 rounded-full bg-[#681423] text-white font-semibold text-sm shadow">
        Đặt Lịch Chụp Ngay
      </a>
    </div>
  </div>
</header>
